<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 280" width="270" height="280">
  <!-- Original pencil sketch of a Seestar S30 Pro-style smart telescope (not a product photo). -->
  <defs>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="1" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.33  0 0 0 0 0.3  0 0 0 0.10 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <pattern id="hatchL" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#6f6f6f" stroke-width="0.8" opacity="0.55"/>
    </pattern>
    <pattern id="hatchM" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#555" stroke-width="0.8" opacity="0.7"/>
    </pattern>
    <pattern id="hatchD" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="3.2" stroke="#3a3a3a" stroke-width="0.9"/>
    </pattern>
    <pattern id="hatchX" width="3.6" height="3.6" patternUnits="userSpaceOnUse" patternTransform="rotate(-42)">
      <line x1="0" y1="0" x2="0" y2="3.6" stroke="#444" stroke-width="0.8" opacity="0.85"/>
    </pattern>
    <radialGradient id="glass" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#d9d9d9"/>
      <stop offset="0.45" stop-color="#7a7a7a"/>
      <stop offset="1" stop-color="#2e2e2e"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="258" height="268" rx="46" fill="#fbfaf6" stroke="#d8d5cc"/>
  <rect x="6" y="6" width="258" height="268" rx="46" fill="#fbfaf6" filter="url(#grain)"/>
  <g filter="url(#pencil)">
    <line x1="135" y1="232" x2="77" y2="258" stroke="#2f2f2f" stroke-width="7.5" stroke-linecap="round"/>
    <line x1="135" y1="232" x2="77" y2="258" stroke="url(#hatchD)" stroke-width="6" stroke-linecap="round"/>
    <line x1="133.5" y1="232" x2="75.5" y2="258" stroke="#bbb" stroke-width="0.8"/>
    <line x1="135" y1="232" x2="135" y2="262" stroke="#2f2f2f" stroke-width="7.5" stroke-linecap="round"/>
    <line x1="135" y1="232" x2="135" y2="262" stroke="url(#hatchD)" stroke-width="6" stroke-linecap="round"/>
    <line x1="133.5" y1="232" x2="133.5" y2="262" stroke="#bbb" stroke-width="0.8"/>
    <line x1="135" y1="232" x2="193" y2="258" stroke="#2f2f2f" stroke-width="7.5" stroke-linecap="round"/>
    <line x1="135" y1="232" x2="193" y2="258" stroke="url(#hatchD)" stroke-width="6" stroke-linecap="round"/>
    <line x1="133.5" y1="232" x2="191.5" y2="258" stroke="#bbb" stroke-width="0.8"/>
    <rect x="120" y="224" width="30" height="12" rx="4" fill="#3a3a3a"/>
    <g transform="rotate(-34 170 112)">
      
    <rect x="140" y="92" width="92" height="44" rx="6" fill="#fbfaf6"/>
    <rect x="140" y="92" width="92" height="44" rx="6" fill="#8d8d8d" opacity="0.45"/>
    <rect x="140" y="92" width="92" height="44" rx="6" fill="url(#hatchD)"/>
    <rect x="140" y="92" width="92" height="44" rx="6" fill="url(#hatchX)"/>
    <rect x="140" y="92" width="92" height="44" rx="6" fill="none" stroke="#2b2b2b" stroke-width="1.7"/>
      <rect x="222" y="95" width="12" height="38" rx="3" fill="#2b2b2b"/>
      <ellipse cx="236" cy="114" rx="6" ry="15" fill="url(#glass)"/>
    </g>
    <path d="M84 110 a24 24 0 0 1 24 -24 H158 a18 18 0 0 1 18 18 V226 a10 10 0 0 1 -10 10 H94 a10 10 0 0 1 -10 -10 Z" fill="#fdfdfb"/>
    <rect x="156" y="100" width="20" height="134" rx="8" fill="url(#hatchL)"/>
    <path d="M84 110 a24 24 0 0 1 24 -24 H158 a18 18 0 0 1 18 18 V226 a10 10 0 0 1 -10 10 H94 a10 10 0 0 1 -10 -10 Z" fill="none" stroke="#3b3b3b" stroke-width="1.5"/>
    <path d="M84 110 a24 24 0 0 1 24 -24 H158 a18 18 0 0 1 18 18 V226 a10 10 0 0 1 -10 10 H94 a10 10 0 0 1 -10 -10 Z" fill="none" stroke="#6a6a6a" stroke-width="0.7" transform="translate(0.8 -0.6)"/>
    
    <rect x="92" y="100" width="32" height="124" rx="16" fill="#fbfaf6"/>
    <rect x="92" y="100" width="32" height="124" rx="16" fill="#8d8d8d" opacity="0.45"/>
    <rect x="92" y="100" width="32" height="124" rx="16" fill="url(#hatchD)"/>
    <rect x="92" y="100" width="32" height="124" rx="16" fill="url(#hatchX)"/>
    <rect x="92" y="100" width="32" height="124" rx="16" fill="none" stroke="#2b2b2b" stroke-width="1.7"/>
    <circle cx="112" cy="130" r="1.7" fill="#fff"/><circle cx="112" cy="140" r="1.7" fill="#fff"/>
    <circle cx="112" cy="150" r="1.7" fill="#fff"/><circle cx="112" cy="160" r="1.7" fill="#fff"/>
    <circle cx="108" cy="208" r="4.5" fill="#e9e9e9" stroke="#2b2b2b" stroke-width="1"/>
  </g>
</svg>
