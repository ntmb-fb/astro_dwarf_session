<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 280" width="270" height="280">
  <!-- Original pencil sketch of a Seestar S50 Pro-style smart telescope (not a product photo). -->
  <defs>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="1" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.33  0 0 0 0 0.3  0 0 0 0.10 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <pattern id="hatchL" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#6f6f6f" stroke-width="0.8" opacity="0.55"/>
    </pattern>
    <pattern id="hatchM" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#555" stroke-width="0.8" opacity="0.7"/>
    </pattern>
    <pattern id="hatchD" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="3.2" stroke="#3a3a3a" stroke-width="0.9"/>
    </pattern>
    <pattern id="hatchX" width="3.6" height="3.6" patternUnits="userSpaceOnUse" patternTransform="rotate(-42)">
      <line x1="0" y1="0" x2="0" y2="3.6" stroke="#444" stroke-width="0.8" opacity="0.85"/>
    </pattern>
    <radialGradient id="glass" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#d9d9d9"/>
      <stop offset="0.45" stop-color="#7a7a7a"/>
      <stop offset="1" stop-color="#2e2e2e"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="258" height="268" rx="46" fill="#fbfaf6" stroke="#d8d5cc"/>
  <rect x="6" y="6" width="258" height="268" rx="46" fill="#fbfaf6" filter="url(#grain)"/>
  <g filter="url(#pencil)">
    <line x1="135" y1="214" x2="89" y2="262" stroke="#2f2f2f" stroke-width="7.5" stroke-linecap="round"/>
    <line x1="135" y1="214" x2="89" y2="262" stroke="url(#hatchD)" stroke-width="6" stroke-linecap="round"/>
    <line x1="133.5" y1="214" x2="87.5" y2="262" stroke="#bbb" stroke-width="0.8"/>
    <line x1="135" y1="214" x2="135" y2="266" stroke="#2f2f2f" stroke-width="7.5" stroke-linecap="round"/>
    <line x1="135" y1="214" x2="135" y2="266" stroke="url(#hatchD)" stroke-width="6" stroke-linecap="round"/>
    <line x1="133.5" y1="214" x2="133.5" y2="266" stroke="#bbb" stroke-width="0.8"/>
    <line x1="135" y1="214" x2="181" y2="262" stroke="#2f2f2f" stroke-width="7.5" stroke-linecap="round"/>
    <line x1="135" y1="214" x2="181" y2="262" stroke="url(#hatchD)" stroke-width="6" stroke-linecap="round"/>
    <line x1="133.5" y1="214" x2="179.5" y2="262" stroke="#bbb" stroke-width="0.8"/>
    <rect x="120" y="206" width="30" height="12" rx="4" fill="#3a3a3a"/>
    <path d="M76 92 a30 30 0 0 1 30 -30 H138 a22 22 0 0 1 22 22 V192 a26 26 0 0 1 -26 26 H100 a24 24 0 0 1 -24 -24 Z" fill="#fdfdfb"/>
    <rect x="140" y="150" width="20" height="64" rx="8" fill="url(#hatchL)"/>
    <path d="M76 92 a30 30 0 0 1 30 -30 H138 a22 22 0 0 1 22 22 V192 a26 26 0 0 1 -26 26 H100 a24 24 0 0 1 -24 -24 Z" fill="none" stroke="#3b3b3b" stroke-width="1.5"/>
    <path d="M76 92 a30 30 0 0 1 30 -30 H138 a22 22 0 0 1 22 22 V192 a26 26 0 0 1 -26 26 H100 a24 24 0 0 1 -24 -24 Z" fill="none" stroke="#6a6a6a" stroke-width="0.7" transform="translate(0.8 -0.6)"/>
    <path d="M128 84 a38 36 0 0 1 76 0 V120 a34 34 0 0 1 -34 34 H150 a22 22 0 0 1 -22 -22 Z" fill="#fdfdfb"/>
    <path d="M190 58 a24 30 0 0 1 14 26 V120 a34 34 0 0 1 -14 27 Z" fill="url(#hatchL)"/>
    <path d="M128 84 a38 36 0 0 1 76 0 V120 a34 34 0 0 1 -34 34 H150 a22 22 0 0 1 -22 -22 Z" fill="none" stroke="#3b3b3b" stroke-width="1.5"/>
    <path d="M128 84 a38 36 0 0 1 76 0 V120 a34 34 0 0 1 -34 34 H150 a22 22 0 0 1 -22 -22 Z" fill="none" stroke="#6a6a6a" stroke-width="0.7" transform="translate(0.8 -0.6)"/>
    <path d="M160 154 V192" stroke="#3b3b3b" stroke-width="1.2"/>
    
    <rect x="86" y="80" width="30" height="124" rx="15" fill="#fbfaf6"/>
    <rect x="86" y="80" width="30" height="124" rx="15" fill="#8d8d8d" opacity="0.45"/>
    <rect x="86" y="80" width="30" height="124" rx="15" fill="url(#hatchD)"/>
    <rect x="86" y="80" width="30" height="124" rx="15" fill="url(#hatchX)"/>
    <rect x="86" y="80" width="30" height="124" rx="15" fill="none" stroke="#2b2b2b" stroke-width="1.7"/>
    <circle cx="101" cy="188" r="4.2" fill="#e9e9e9" stroke="#2b2b2b" stroke-width="1"/>
    <circle cx="172" cy="94" r="20" fill="#2b2b2b"/>
    <circle cx="172" cy="94" r="14" fill="url(#glass)"/>
    <circle cx="167" cy="89" r="3.2" fill="#fff" opacity="0.85"/>
    <circle cx="183" cy="116" r="3" fill="none" stroke="#3b3b3b" stroke-width="1"/>
  </g>
</svg>
