<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 280" width="270" height="280">
  <!-- Original pencil sketch of a Seestar S50-style smart telescope (not a product photo). -->
  <defs>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="1" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.33  0 0 0 0 0.3  0 0 0 0.10 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <pattern id="hatchL" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#6f6f6f" stroke-width="0.8" opacity="0.55"/>
    </pattern>
    <pattern id="hatchM" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#555" stroke-width="0.8" opacity="0.7"/>
    </pattern>
    <pattern id="hatchD" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="3.2" stroke="#3a3a3a" stroke-width="0.9"/>
    </pattern>
    <pattern id="hatchX" width="3.6" height="3.6" patternUnits="userSpaceOnUse" patternTransform="rotate(-42)">
      <line x1="0" y1="0" x2="0" y2="3.6" stroke="#444" stroke-width="0.8" opacity="0.85"/>
    </pattern>
    <radialGradient id="glass" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#d9d9d9"/>
      <stop offset="0.45" stop-color="#7a7a7a"/>
      <stop offset="1" stop-color="#2e2e2e"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="258" height="268" rx="46" fill="#fbfaf6" stroke="#d8d5cc"/>
  <rect x="6" y="6" width="258" height="268" rx="46" fill="#fbfaf6" filter="url(#grain)"/>
  <g filter="url(#pencil)">
    <line x1="135" y1="196" x2="93" y2="262" stroke="#2f2f2f" stroke-width="7.5" stroke-linecap="round"/>
    <line x1="135" y1="196" x2="93" y2="262" stroke="url(#hatchD)" stroke-width="6" stroke-linecap="round"/>
    <line x1="133.5" y1="196" x2="91.5" y2="262" stroke="#bbb" stroke-width="0.8"/>
    <line x1="135" y1="196" x2="135" y2="266" stroke="#2f2f2f" stroke-width="7.5" stroke-linecap="round"/>
    <line x1="135" y1="196" x2="135" y2="266" stroke="url(#hatchD)" stroke-width="6" stroke-linecap="round"/>
    <line x1="133.5" y1="196" x2="133.5" y2="266" stroke="#bbb" stroke-width="0.8"/>
    <line x1="135" y1="196" x2="177" y2="262" stroke="#2f2f2f" stroke-width="7.5" stroke-linecap="round"/>
    <line x1="135" y1="196" x2="177" y2="262" stroke="url(#hatchD)" stroke-width="6" stroke-linecap="round"/>
    <line x1="133.5" y1="196" x2="175.5" y2="262" stroke="#bbb" stroke-width="0.8"/>
    <rect x="120" y="188" width="30" height="12" rx="4" fill="#3a3a3a"/>
    
    <rect x="74" y="152" width="126" height="40" rx="7" fill="#fbfaf6"/>
    <rect x="74" y="152" width="126" height="40" rx="7" fill="#8d8d8d" opacity="0.45"/>
    <rect x="74" y="152" width="126" height="40" rx="7" fill="url(#hatchD)"/>
    <rect x="74" y="152" width="126" height="40" rx="7" fill="url(#hatchX)"/>
    <rect x="74" y="152" width="126" height="40" rx="7" fill="none" stroke="#2b2b2b" stroke-width="1.7"/>
    
    <path d="M150 190 V72 a29 29 0 0 1 58 0 V190 Z" fill="#fbfaf6"/>
    <path d="M150 190 V72 a29 29 0 0 1 58 0 V190 Z" fill="#8d8d8d" opacity="0.45"/>
    <path d="M150 190 V72 a29 29 0 0 1 58 0 V190 Z" fill="url(#hatchD)"/>
    <path d="M150 190 V72 a29 29 0 0 1 58 0 V190 Z" fill="url(#hatchX)"/>
    <path d="M150 190 V72 a29 29 0 0 1 58 0 V190 Z" fill="none" stroke="#2b2b2b" stroke-width="1.7"/>
    <circle cx="179" cy="88" r="15" fill="none" stroke="#2b2b2b" stroke-width="1.4"/>
    <g transform="rotate(-24 128 104)">
      
    <path d="M62 104 C62 80 82 71 104 71 H150 C177 71 194 88 194 113 C194 138 176 153 150 153 H104 C82 153 62 128 62 104 Z" fill="#fbfaf6"/>
    <path d="M62 104 C62 80 82 71 104 71 H150 C177 71 194 88 194 113 C194 138 176 153 150 153 H104 C82 153 62 128 62 104 Z" fill="#8d8d8d" opacity="0.45"/>
    <path d="M62 104 C62 80 82 71 104 71 H150 C177 71 194 88 194 113 C194 138 176 153 150 153 H104 C82 153 62 128 62 104 Z" fill="url(#hatchD)"/>
    <path d="M62 104 C62 80 82 71 104 71 H150 C177 71 194 88 194 113 C194 138 176 153 150 153 H104 C82 153 62 128 62 104 Z" fill="url(#hatchX)"/>
    <path d="M62 104 C62 80 82 71 104 71 H150 C177 71 194 88 194 113 C194 138 176 153 150 153 H104 C82 153 62 128 62 104 Z" fill="none" stroke="#2b2b2b" stroke-width="1.7"/>
      <ellipse cx="63" cy="104" rx="11" ry="30" fill="#2b2b2b"/>
      <ellipse cx="64" cy="104" rx="7" ry="22" fill="url(#glass)"/>
      <ellipse cx="61" cy="95" rx="1.8" ry="6" fill="#fff" opacity="0.8"/>
    </g>
  </g>
</svg>
