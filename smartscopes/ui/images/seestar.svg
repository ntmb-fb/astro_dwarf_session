<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 280" width="270" height="280">
  <!-- Original illustration of a ZWO Seestar-style smart telescope (not a
       product photo): matte-black alt-az head on a mini tripod, drawn in the
       same "device on a light rounded tile" style as the Dwarf model icons. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e6ea"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1c1f"/>
      <stop offset="0.55" stop-color="#34363b"/>
      <stop offset="1" stop-color="#202125"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2b2f"/>
      <stop offset="0.6" stop-color="#3b3d42"/>
      <stop offset="1" stop-color="#232427"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3c41"/>
      <stop offset="1" stop-color="#16171a"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#9fe3c9"/>
      <stop offset="0.35" stop-color="#2f7d6a"/>
      <stop offset="0.8" stop-color="#0d2a26"/>
      <stop offset="1" stop-color="#05100f"/>
    </radialGradient>
    <pattern id="ribs" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
      <rect width="5" height="5" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="#4a4c52" stroke-width="1.6"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="6" y="6" width="258" height="268" rx="46" fill="url(#tile)" stroke="#d3d6db"/>

  <!-- tripod -->
  <g stroke-linecap="round">
    <line x1="135" y1="200" x2="92" y2="262" stroke="#16171a" stroke-width="11"/>
    <line x1="135" y1="200" x2="178" y2="262" stroke="#16171a" stroke-width="11"/>
    <line x1="135" y1="200" x2="135" y2="266" stroke="#26272b" stroke-width="10"/>
    <line x1="96" y1="256" x2="90" y2="265" stroke="#3a3c41" stroke-width="12"/>
    <line x1="174" y1="256" x2="180" y2="265" stroke="#3a3c41" stroke-width="12"/>
  </g>
  <rect x="118" y="190" width="34" height="14" rx="4" fill="#2b2c30"/>
  <circle cx="126" cy="197" r="2.4" fill="#8a8d94"/>
  <circle cx="144" cy="197" r="2.4" fill="#8a8d94"/>

  <g filter="url(#shadow)">
    <!-- base block -->
    <rect x="72" y="150" width="130" height="42" rx="7" fill="url(#body)"/>
    <!-- vertical fork arm (right) with rounded top -->
    <path d="M150 190 V70 a30 30 0 0 1 60 0 V190 Z" fill="url(#arm)"/>
    <circle cx="180" cy="86" r="17" fill="#2c2d31" stroke="#46484e" stroke-width="2"/>
    <!-- optical head: rounded teardrop, lens at the upper-left narrow end -->
    <g transform="rotate(-24 128 104)">
      <path d="M60 104 C60 80 80 70 104 70 H150 C178 70 196 88 196 114 C196 140 176 156 150 156 H104 C80 156 60 128 60 104 Z"
            fill="url(#head)"/>
      <path d="M92 86 H148 C170 86 182 99 182 116 C182 132 170 142 150 142 H100 C86 142 76 128 76 112 C76 98 82 86 92 86 Z"
            fill="url(#ribs)" opacity="0.9"/>
      <!-- lens bezel and glass -->
      <ellipse cx="62" cy="104" rx="11" ry="30" fill="#0f1012"/>
      <ellipse cx="63" cy="104" rx="7" ry="22" fill="url(#lens)"/>
      <ellipse cx="60" cy="95" rx="2" ry="6" fill="#ffffff" opacity="0.55"/>
    </g>
  </g>
</svg>
